<main class="page">
  <section class="card">
    <header class="header">
      <h1 class="title">Buscador de Pokémon</h1>
      <p class="subtitle">Escribe un nombre y consulta la PokeAPI</p>
    </header>

    <form class="search" (ngSubmit)="search()">
      <input
        class="input"
        type="text"
        name="query"
        placeholder="Ej: ditto, pikachu, charizard"
        [(ngModel)]="query"
        autocomplete="off"
        aria-label="Nombre del Pokémon"
      />
      <button class="button" type="submit" [disabled]="loading()">
        {{ loading() ? 'Buscando...' : 'Buscar' }}
      </button>
    </form>

    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }

    @if (pokemon(); as p) {
      <div class="result">
        <div class="sprite">
          <img [src]="p.image" [alt]="p.name" />
        </div>
        <h2 class="name">{{ p.name }}</h2>
      </div>
    }
  </section>
</main>
